<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Termo SENAI</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body id="app-body" class="bg-[#0b0f17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 transition-colors duration-300 select-none relative">

  <!-- Header Minimalista -->
  <header class="w-full max-w-md flex justify-between items-center py-3 border-b border-slate-800/80">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-extrabold tracking-widest text-white uppercase">TERMO</h1>
    </div>
    <div class="flex items-center gap-2">
      <select id="theme-select" class="bg-slate-900 text-xs font-semibold text-slate-300 border border-slate-800 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer hover:border-slate-700 transition">
        <option value="dark">Dark</option>
        <option value="cyberpunk">Cyberpunk</option>
      </select>
      <button id="btn-restart" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 font-semibold text-xs px-3 py-1.5 rounded-lg transition active:scale-95 cursor-pointer">
        Novo Jogo
      </button>
    </div>
  </header>

  <!-- Status -->
  <div id="status-message" class="h-6 text-xs uppercase tracking-wider font-semibold text-slate-400 my-3 text-center">
    Carregando...
  </div>

  <!-- Grade (6x5) -->
  <main id="grid-container" class="my-auto flex flex-col items-center justify-center w-full max-w-md">
    <div id="grid" class="flex flex-col gap-2 items-center justify-center"></div>
  </main>

  <!-- Teclado Virtual Integrado -->
  <footer id="keyboard" class="w-full max-w-md flex flex-col gap-1.5 pb-2"></footer>

  <!-- Modal de Fim de Jogo Autoral -->
  <div id="modal-endgame" class="fixed inset-0 bg-[#070a0f]/80 backdrop-blur-md hidden items-center justify-center p-4 z-50 transition-opacity duration-300">
    <div id="modal-card" class="glass-card border border-slate-800/90 rounded-2xl p-6 max-w-xs sm:max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-5 transition-all duration-300 scale-95 opacity-0">
      
      <!-- Badge de Resultado -->
      <div id="modal-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        Vitória
      </div>

      <div class="space-y-1">
        <h2 id="modal-title" class="text-2xl font-extrabold text-white tracking-tight">Vitória Excelente!</h2>
        <p id="modal-body" class="text-xs font-medium text-slate-400">Você adivinhou a palavra com sucesso.</p>
      </div>
      
      <!-- Palavra Secreta Relevada -->
      <div class="bg-slate-900/90 w-full py-3 px-4 rounded-xl border border-slate-800">
        <span class="text-[10px] text-slate-500 block uppercase tracking-widest font-bold mb-0.5">Palavra Secreta</span>
        <span id="modal-secret-word" class="text-2xl font-black text-emerald-400 tracking-[0.25em]">---</span>
      </div>

      <!-- Botão Único Integrado -->
      <button id="modal-btn-restart" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-3 px-6 rounded-xl shadow-lg hover:shadow-emerald-900/30 active:scale-[0.98] transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
        <span>Jogar Novamente</span>
      </button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
