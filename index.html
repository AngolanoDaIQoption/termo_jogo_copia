<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Termo SENAI - CIDI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="app-body" class="bg-slate-900 text-white min-h-screen flex flex-col justify-between items-center p-4 transition-colors duration-300">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-2 border-b border-slate-700">
    <h1 class="text-2xl font-bold tracking-wider text-green-400">TERMO</h1>
    <div class="flex items-center gap-2">
      <select id="theme-select" class="bg-slate-800 text-sm border border-slate-700 rounded px-2 py-1 focus:outline-none">
        <option value="dark">Dark</option>
        <option value="cyberpunk">Cyberpunk</option>
      </select>
      <button id="btn-restart" class="bg-green-600 hover:bg-green-500 text-white font-semibold text-xs px-3 py-1.5 rounded transition">
        Novo Jogo
      </button>
    </div>
  </header>

  <!-- Status / Loading -->
  <div id="status-message" class="h-6 text-sm text-slate-400 my-2 font-medium">Carregando dicionário...</div>

  <!-- Grade do Jogo (6x5) -->
  <main id="grid" class="grid grid-rows-6 gap-2 my-auto">
    <!-- Linhas geradas dinamicamente via JS -->
  </main>

  <!-- Teclado Virtual -->
  <footer id="keyboard" class="w-full max-w-md flex flex-col gap-1.5 pb-4">
    <!-- Teclas geradas dinamicamente via JS -->
  </footer>

  <!-- Script principal como Módulo -->
  <script type="module" src="app.js"></script>
</body>
</html>
